<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Interactive 3D explorer of historical and future solar and lunar eclipses."
    />
    <meta name="histeclipse-version" content="%VITE_COMMIT_SHA%" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- The app awaits these before it starts (#222): fetch them alongside its code. -->
    <link rel="preload" href="/data/delta-t.json" as="fetch" crossorigin />
    <link rel="preload" href="/data/lunar/index.json" as="fetch" crossorigin />
    <link rel="preload" href="/data/solar/index.json" as="fetch" crossorigin />
    <!-- And what the link's first view reads next (#222), from its t=, ma= and mode=. A guess
         that misses costs one unused fetch; the app still reads what it needs. -->
    <script id="boot-preloads">
      (function () {
        var query = new URLSearchParams(location.search);
        var files = ['famous-eclipses.json'];
        if (query.has('ma')) {
          files.push('polarity.json', 'paleodem/index.json');
        } else {
          files.push('seaice/index.json', 'sealevel/index.json');
          if (query.get('mode') === 'sky') files.push('sky.json', 'hip-stars.json');
        }
        // The eclipse catalogues' century for the year shown (they cover -3999 to 3000).
        var written = /^(-?\d{4,})-/.exec(query.get('t') || '');
        var year = written ? Number(written[1]) : new Date().getUTCFullYear();
        if (year >= -3999 && year <= 3000) {
          var century = Math.floor(year / 100) * 100;
          files.push('lunar/' + century + '.json', 'solar/' + century + '.json');
        }
        files.forEach(function (file) {
          var link = document.createElement('link');
          link.rel = 'preload';
          link.as = 'fetch';
          link.crossOrigin = 'anonymous';
          link.href = 'data/' + file;
          document.head.appendChild(link);
        });
      })();
    </script>
    <title>histeclipse</title>
  </head>
  <body>
    <div id="app"></div>
    <!-- The header's name and date, drawn with the page (#220): until the app has started, the
         date it will show is already there, the same size, so the reader sees it at once. Only
         where it is sure of the words: today, or a Gregorian t=, on the globe. The app replaces
         it when it lays the page out. -->
    <script id="boot-hud">
      (function () {
        var query = new URLSearchParams(location.search);
        var mode = query.get('mode') || 'globe';
        var calendar = query.get('cal') || 'gregorian';
        if (query.has('ma') || query.has('boundaries') || mode !== 'globe') return;
        if (calendar !== 'gregorian') return;
        var at = new Date();
        var written = query.get('t');
        if (written) {
          var parts = /^(\d{4})-(\d\d)-(\d\d)T(\d\d):(\d\d)/.exec(written);
          if (!parts || Number(parts[1]) < 1583) return;
          at = new Date(Date.UTC(+parts[1], +parts[2] - 1, +parts[3], +parts[4], +parts[5]));
        }
        var months = [
          'January',
          'February',
          'March',
          'April',
          'May',
          'June',
          'July',
          'August',
          'September',
          'October',
          'November',
          'December',
        ];
        var two = function (n) {
          return (n < 10 ? '0' : '') + n;
        };
        var make = function (tag, className, text) {
          var made = document.createElement(tag);
          if (className) made.className = className;
          if (text) made.textContent = text;
          return made;
        };
        var hud = make('header', 'hud');
        hud.setAttribute('aria-hidden', 'true');
        var name = make('h1');
        name.append(make('a', 'home', 'histeclipse'));
        var when = make('p', 'hud-when');
        var button = make('button', 'hud-date-button');
        button.type = 'button';
        button.tabIndex = -1;
        button.append(
          make(
            'time',
            'hud-date',
            at.getUTCDate() + ' ' + months[at.getUTCMonth()] + ' ' + at.getUTCFullYear() + ' CE',
          ),
        );
        when.append(
          button,
          ' ',
          make('span', 'hud-time', two(at.getUTCHours()) + ':' + two(at.getUTCMinutes()) + ' UT'),
        );
        hud.append(name, when);
        document.getElementById('app').append(hud);
      })();
    </script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
