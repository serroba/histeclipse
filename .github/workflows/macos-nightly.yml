name: macOS nightly

# The whole desktop e2e suite on macOS, once a day on main and on demand. A Mac's GPU limits
# differ from Linux's: a shader once passed on Linux and drew a black globe there, as ANGLE over
# Metal allows 16 textures a shader and headless Chromium on Linux 32 (#110). Pull requests run
# only the tests tagged @gpu on a Mac (ci.yml), which draw every shader once: the rest of the suite
# checks what does not depend on the GPU, and Linux runs it in each pull request.

on:
  schedule:
    - cron: '41 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-nightly-${{ github.ref }}
  cancel-in-progress: false

jobs:
  e2e-macos:
    name: End-to-end on macOS (desktop, ${{ matrix.shard }}/2)
    runs-on: macos-latest
    timeout-minutes: 20
    # One worker fills the Mac runner (a second made each test twice as slow), so it is split in
    # two.
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The search model (#393), kept between runs for each pin in models.lock.json. The build
      # checks every file against its pinned SHA-256 whether it came from here or the network.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: public/models/*/onnx
          key: models-${{ hashFiles('models.lock.json') }}
      - run: pnpm exec playwright install chromium
      - run: pnpm test:e2e --project=desktop --shard="$SHARD/2"
        env:
          SHARD: ${{ matrix.shard }}
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report-macos-${{ matrix.shard }}
          path: |
            playwright-report/
            test-results/
          retention-days: 14
