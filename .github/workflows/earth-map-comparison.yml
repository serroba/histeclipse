name: Earth map comparison

# Diagnostic A/B evidence on one real GPU, independent of the required CI gate.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'e2e/perf/earthMap.perf.ts'
      - '.github/workflows/earth-map-comparison.yml'

permissions:
  contents: read

concurrency:
  group: earth-map-comparison-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compare:
    name: Compare Earth maps on a real GPU
    runs-on: macos-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: public/models/*/onnx
          key: models-${{ hashFiles('models.lock.json') }}
      - run: pnpm build
      - run: pnpm exec playwright install chromium
      - run: pnpm exec playwright test --config playwright.perf.config.ts --project desktop earthMap.perf.ts
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: earth-map-comparison
          path: |
            test-results/rendering-audit-runs/
            test-results/earth-map-comparison/
          retention-days: 30
