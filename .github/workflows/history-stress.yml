name: History wiring stress

# On demand; a change to this diagnostic also validates it. No extra PR acceptance executions.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/history-stress.yml'

permissions:
  contents: read

concurrency:
  group: history-stress-${{ github.ref }}
  cancel-in-progress: true

jobs:
  history:
    name: Repeat history wiring without retries
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: public/models/*/onnx
          key: models-${{ hashFiles('models.lock.json') }}
      - run: pnpm exec playwright install chromium
      - run: pnpm test:e2e smoke.spec.ts --grep 'Back and Forward restore|Back restores the rendered' --project=desktop --project=mobile --repeat-each=3 --workers=2 --retries=0
        env:
          E2E_SCOPE: acceptance
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: history-stress
          path: |
            test-results/
            playwright-report/
          retention-days: 14
