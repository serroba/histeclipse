name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  web:
    name: Web (format, lint, typecheck, test, build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The search model (#393), kept between runs for each pin in models.lock.json. The build
      # checks every file against its pinned SHA-256 whether it came from here or the network.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: public/models/*/onnx
          key: models-${{ hashFiles('models.lock.json') }}
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm coverage
      - run: pnpm build

  # The slowest job by far: WebGL draws in software on the runner's CPU. Split in four, run
  # side by side.
  e2e:
    name: End-to-end (local production build, ${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      # Every shard runs to the end, so one failure doesn't hide another.
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The search model (#393), kept between runs for each pin in models.lock.json. The build
      # checks every file against its pinned SHA-256 whether it came from here or the network.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: public/models/*/onnx
          key: models-${{ hashFiles('models.lock.json') }}
      - id: playwright
        run: echo "version=$(pnpm exec playwright --version | cut -d' ' -f2)" >> "$GITHUB_OUTPUT"
      # The browser, kept between runs for each version of Playwright.
      - id: browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      # The runner's image already has the system libraries Chromium needs; --with-deps only
      # added CJK and Thai fonts, and once spent seven minutes fetching them from apt.
      - if: steps.browsers.outputs.cache-hit != 'true'
        run: pnpm exec playwright install chromium
      # Playwright's default, two workers, already fills the 4 vCPUs: a third made each test
      # two-thirds slower, finished no sooner, and made a test flaky.
      - run: pnpm test:e2e --shard="$SHARD/4"
        env:
          SHARD: ${{ matrix.shard }}
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report-${{ matrix.shard }}
          path: |
            playwright-report/
            test-results/
          retention-days: 14

  # A Mac's GPU limits differ from Linux's: a shader once passed here and drew a black globe there.
  # One worker fills the Mac runner (a second made each test twice as slow), so it is split in
  # two to finish alongside the Linux shards.
  e2e-macos:
    name: End-to-end on macOS (desktop, ${{ matrix.shard }}/2)
    runs-on: macos-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The search model (#393), kept between runs for each pin in models.lock.json. The build
      # checks every file against its pinned SHA-256 whether it came from here or the network.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: public/models/*/onnx
          key: models-${{ hashFiles('models.lock.json') }}
      - run: pnpm exec playwright install chromium
      - run: pnpm test:e2e --project=desktop --shard="$SHARD/2"
        env:
          SHARD: ${{ matrix.shard }}
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report-macos-${{ matrix.shard }}
          path: |
            playwright-report/
            test-results/
          retention-days: 14

  pipeline:
    name: Data pipeline (ruff, mypy, basedpyright, pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: data-pipeline
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv sync --locked
      - run: uv run --locked ruff format --check .
      - run: uv run --locked ruff check --output-format=github .
      - run: uv run --locked mypy
      - run: uv run --locked basedpyright
      - run: uv run --locked pytest

  plates:
    name: Plate masks (ruff, mypy, basedpyright, pytest; pyGPlates on Python 3.13)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: data-pipeline/plates
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv sync --locked
      - run: uv run --locked ruff format --check .
      - run: uv run --locked ruff check --output-format=github .
      - run: uv run --locked mypy
      - run: uv run --locked basedpyright
      - run: uv run --locked pytest

  workflows:
    name: Workflow security (zizmor)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uvx zizmor@1.31.1 --format=github --persona=pedantic .
        env:
          GH_TOKEN: ${{ github.token }}

  # How many folders under src a pull request touches (#383): a coupling signal, reported in the
  # run's summary, never failing. Not in CI OK's needs.
  folders:
    name: Folders touched (report only)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      pull-requests: read # to list the pull request's files; nothing is checked out
    steps:
      - name: List the folders under src the pull request changes
        run: |
          gh api --paginate "repos/$REPO/pulls/$PR/files" --jq '.[].filename' \
            | awk -F/ '$1 == "src" { print (NF > 2 ? $2 : "(src)") }' | sort -u > folders.txt
          {
            echo "### Folders under src touched: $(wc -l < folders.txt | tr -d ' ')"
            sed 's/^/- /' folders.txt
          } >> "$GITHUB_STEP_SUMMARY"
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}

  # Single required check for branch protection, so adding jobs never requires editing the ruleset.
  ci-ok:
    name: CI OK
    if: always()
    needs: [web, e2e, e2e-macos, pipeline, plates, workflows]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Fail if any required job did not succeed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
        run: exit 1
