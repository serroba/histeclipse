name: Live smoke test

# Runs the e2e suite against the public site: after every deploy (called from deploy.yml),
# daily to catch problems between releases, and on demand.
on:
  workflow_call:
    inputs:
      expected-version:
        description: Commit SHA the live site must be serving before tests run
        type: string
        required: false
        default: ''
  workflow_dispatch:
  schedule:
    - cron: '17 6 * * *'

permissions:
  contents: read

# Never cancel: a post-deploy verification must report its result.
concurrency:
  group: live-smoke-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # The whole suite against the live site, in four shards side by side: in one job it outgrew
  # its 20 minutes.
  smoke:
    name: Smoke test live site (${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    env:
      BASE_URL: https://serroba.github.io/histeclipse/
      EXPECTED_VERSION: ${{ inputs.expected-version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Wait until the new release is publicly served
        if: env.EXPECTED_VERSION != ''
        run: |
          for _ in $(seq 1 60); do
            if curl -fsS "$BASE_URL" | grep -q "content=\"$EXPECTED_VERSION\""; then
              echo "Live site is serving $EXPECTED_VERSION"
              exit 0
            fi
            sleep 10
          done
          echo "::error::$BASE_URL did not serve $EXPECTED_VERSION within 10 minutes"
          exit 1
      - id: playwright
        run: echo "version=$(pnpm exec playwright --version | cut -d' ' -f2)" >> "$GITHUB_OUTPUT"
      # The browser, kept between runs for each version of Playwright, as in CI.
      - id: browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      # The runner's image has Chromium's system libraries; --with-deps only added fonts.
      - if: steps.browsers.outputs.cache-hit != 'true'
        run: pnpm exec playwright install chromium
      - run: pnpm test:e2e --shard="$SHARD/4"
        env:
          SHARD: ${{ matrix.shard }}
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report-live-${{ matrix.shard }}
          path: |
            playwright-report/
            test-results/
          retention-days: 14
