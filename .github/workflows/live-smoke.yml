name: Live smoke test

# Runs the e2e suite against the public site. After every deploy (called from deploy.yml), only
# the scenarios tagged @live: what production adds to the build CI already tested (#348). Daily,
# to catch problems between releases, and on demand, the whole suite.
on:
  workflow_call:
    inputs:
      expected-version:
        description: Commit SHA the live site must be serving before tests run
        type: string
        required: false
        default: ''
      scope:
        description: "'live' for the @live scenarios only; 'full' for the whole suite"
        type: string
        required: false
        default: full
  workflow_dispatch:
  schedule:
    - cron: '17 6 * * *'

permissions:
  contents: read

# Never cancel: a post-deploy verification must report its result.
concurrency:
  group: live-smoke-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # The whole suite runs in four shards side by side (in one job it outgrew its 20 minutes); the
  # @live scenarios in one. A scheduled or manual run has no inputs, so it runs everything.
  smoke:
    name: Smoke test live site (${{ inputs.scope == 'live' && 'after deploy' || format('{0}/4', matrix.shard) }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(inputs.scope == 'live' && '[1]' || '[1, 2, 3, 4]') }}
    env:
      BASE_URL: https://histeclipse.limits.world/
      EXPECTED_VERSION: ${{ inputs.expected-version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Wait until the new release is publicly served
        if: env.EXPECTED_VERSION != ''
        run: |
          for _ in $(seq 1 60); do
            if curl -fsS "$BASE_URL" | grep -q "content=\"$EXPECTED_VERSION\""; then
              echo "Live site is serving $EXPECTED_VERSION"
              exit 0
            fi
            sleep 10
          done
          echo "::error::$BASE_URL did not serve $EXPECTED_VERSION within 10 minutes"
          exit 1
      - id: playwright
        run: echo "version=$(pnpm exec playwright --version | cut -d' ' -f2)" >> "$GITHUB_OUTPUT"
      # The browser, kept between runs for each version of Playwright, as in CI.
      - id: browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      # The runner's image has Chromium's system libraries; --with-deps only added fonts.
      - if: steps.browsers.outputs.cache-hit != 'true'
        run: pnpm exec playwright install chromium
      - if: inputs.scope == 'live'
        run: pnpm test:e2e --grep @live --project desktop --project mobile
      - if: inputs.scope != 'live'
        run: pnpm test:e2e --shard="$SHARD/4"
        env:
          SHARD: ${{ matrix.shard }}
      # Timings survive passing and failing runs; traces remain failure-only.
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: timings-live-${{ matrix.shard }}
          path: test-results/timings.*
          retention-days: 30
          if-no-files-found: warn
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report-live-${{ matrix.shard }}
          path: |
            playwright-report/
            test-results/
          retention-days: 14
